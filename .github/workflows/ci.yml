name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (a new push to a PR/branch supersedes
# the in-flight one) to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This plugin has no dependencies and no build step: the source in lib/
      # is what ships. So CI validates the source and the packaged artifact
      # directly, with zero install.

      - name: Syntax-check host half (lib/index.js)
        run: node --check lib/index.js

      - name: Syntax-check client half (lib/client.js)
        run: node --check lib/client.js

      - name: Assert declared files exist
        shell: bash
        run: |
          set -euo pipefail
          for f in lib/index.js lib/client.js cordis.patch.yml; do
            test -f "$f" || { echo "missing declared file: $f" >&2; exit 1; }
          done
          echo "all declared files present"

      - name: Verify the bundle packs cleanly
        run: npm pack --dry-run
